spring.application.name=associate-registry

# File-based H2 database. The path is relative to the backend working directory,
# so records survive restarts when the API is started from the backend folder.
spring.datasource.url=jdbc:h2:file:./data/associate-registry;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
